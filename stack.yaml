# What this STACK is, for the harness (~/ui-long-degradation-test). Read at `base-empty`, never
# from the working tree, so a run always measures the layers the base declared.
#
# ── WHY THIS ARM EXISTS ───────────────────────────────────────────────────────────────────────
# A RISK PROBE for gradual adoption, not a model of it.
#
# Every other arm is architecturally PURE. A gradual-adoption story — migrate the endpoints that
# keep changing, leave the stable ones alone — necessarily produces a MIXED application, where a
# developer and an AI agent must hold two backend idioms at once. It is entirely plausible that a
# mixed app erodes worse than either pure one: the agent picks the wrong idiom for an endpoint, or
# copies whichever neighbour it happened to read first, or duplicates a rule across the two styles.
# Nothing measured so far would have shown that, and a product built on gradual adoption depends
# on it not being true.
#
# The split here is BY HTTP METHOD and is fixed by CLAUDE.md: reads (GET) are Spring
# @RestController, writes (POST/PUT/DELETE) are OfficeFloor YAML + a logic class. It is
# deterministic, needs no lookup table the agent must remember, yields a roughly even mix over the
# ~60 checkpoints, and puts the orchestration-heavy endpoints on the OfficeFloor side — which is
# where a churn-triggered migration would in practice move things first.
#
# It therefore answers the PREREQUISITE question ("is holding two idioms harmful in itself?"), not
# the product question ("does migration-on-churn work?"). If mixing is harmful per se, gradual
# adoption is in trouble however the migration is triggered. Compare against the two pure arms
# with the SAME front end: officehq-tanstack-officefloor and officehq-tanstack-spring.
#
# The mix RATIO needs no new metric: the backend class-shape table already separates
# `officefloor-procedure` from `spring-bean`, so each checkpoint's blend is visible, and a run
# that quietly abandons one idiom shows up there rather than having to be read out of diffs.
layers:
  frontend:
    root: src/main/frontend
    ext: [ts, tsx]
    jscpd_format: typescript,tsx
    handler_pattern: "/routes/[^:]*::"
    function_package_glob: "src/main/frontend/features/**/*.slot.tsx"
  backend:
    root: src/main/java
    ext: [java]
    jscpd_format: java
    # ONE pattern spanning BOTH idioms, so the entry-surface metrics (entry_cc, wmc_handler,
    # erosion_handler) cover the whole backend rather than half of it. An OfficeFloor procedure is
    # reached through `service(...)`; a Spring read handler lives on a *Controller. Plain
    # @Service/@Repository beans are excluded, as in every other arm.
    handler_pattern: "(::service$|Controller[^:]*::)"
    config_globs: ["src/main/resources/officefloor/**/*.yml"]
    # Wired nodes exist for the WRITE half only, so node_count will be roughly half the endpoint
    # count. That is the architecture being reported, not a partial declaration — and the gap
    # between node_count and the total endpoint count is itself the mix ratio.
    node_roots:
      wiring_glob: "src/main/resources/officefloor/rest/**/*.yml"
      class_regex: 'class:\s*([\w.]+)'
      node_method: service
